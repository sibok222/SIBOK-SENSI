<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBOK VIP Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #080312; color: #f1f5f9; font-family: 'Rajdhani', sans-serif; padding: 30px 15px; display: flex; justify-content: center; }
        .console {
            background: rgba(18, 10, 36, 0.9); border: 1px solid rgba(255, 0, 128, 0.3); border-top: 3px solid #ff0080;
            border-radius: 14px; padding: 30px; width: 100%; max-width: 480px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        h2 { font-family: 'Orbitron', sans-serif; color: #ff0080; text-align: center; font-size: 20px; margin-bottom: 20px; }
        .field-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #94a3b8; text-transform: uppercase; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; background: #0f0621; border: 1px solid #2e1065; border-radius: 6px; color: #fff; font-family: 'Orbitron', sans-serif; outline: none; }
        input:focus, select:focus { border-color: #ff0080; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #ff0080, #7928ca); border: none; border-radius: 6px; color: #fff; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { box-shadow: 0 0 15px rgba(255, 0, 128, 0.6); }
        .btn-warn { background: linear-gradient(135deg, #ff5500, #b32400); margin-top: 15px; }
        .key-display { margin-top: 15px; padding: 12px; background: rgba(0, 255, 204, 0.1); border: 1px dashed #00ffcc; border-radius: 6px; color: #00ffcc; font-family: 'Orbitron', sans-serif; font-size: 14px; text-align: center; cursor: pointer; display: none; }
    </style>
</head>
<body>
    <div class="console">
        <h2>⚡ ADMIN COMMAND CENTER ⚡</h2>
        <div class="field-group">
            <label>Admin Passcode</label>
            <input type="password" id="adminPass" placeholder="••••••••">
        </div>
        <hr style="border: 0.5px solid rgba(255,255,255,0.08); margin: 20px 0;">
        <div class="field-group">
            <label>Select VIP Duration</label>
            <select id="duration">
                <option value="1">1 Day Pass</option>
                <option value="7">7 Days Pass</option>
                <option value="30">30 Days Pass</option>
            </select>
        </div>
        <button class="btn" onclick="generateKey()">GENERATE VIP KEY</button>
        <div id="keyBox" class="key-display" onclick="copyKey()"></div>
        <button class="btn btn-warn" onclick="toggleMaintenance()">TOGGLE MAINTENANCE MODE</button>
    </div>
    <script>
        async function generateKey() {
            const pass = document.getElementById('adminPass').value;
            const days = document.getElementById('duration').value;
            const keyBox = document.getElementById('keyBox');
            if (!pass) return alert('Enter Admin Password!');
            const res = await fetch('/api/admin/generate-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-password': pass },
                body: JSON.stringify({ durationDays: days })
            });
            const data = await res.json();
            if (data.success) {
                keyBox.style.display = 'block'; keyBox.innerText = data.key + ' (Click to Copy)'; keyBox.dataset.raw = data.key;
            } else { alert(data.message); }
        }
        function copyKey() {
            const keyBox = document.getElementById('keyBox');
            if(keyBox.dataset.raw) { navigator.clipboard.writeText(keyBox.dataset.raw); alert('VIP Key Copied!'); }
        }
        async function toggleMaintenance() {
            const pass = document.getElementById('adminPass').value;
            if (!pass) return alert('Enter Admin Password!');
            const res = await fetch('/api/admin/toggle-maintenance', {
                method: 'POST', headers: { 'x-admin-password': pass }
            });
            const data = await res.json();
            if (data.success) { alert('Maintenance Mode Changed: ' + data.maintenance); } else { alert(data.message); }
        }
    </script>
</body>
</html>
